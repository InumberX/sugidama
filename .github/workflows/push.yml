name: push

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  cache-version: v1
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      npm-cache-dir-path: ${{ steps.npm-cache-dir-path.outputs.dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Get npm cache directory path
        id: npm-cache-dir-path
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache-dir-path.outputs.dir }}
          key: ${{ env.cache-version }}-${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.cache-version }}-${{ runner.os }}-npm-

      - run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ needs.setup.outputs.npm-cache-dir-path }}
          key: ${{ env.cache-version }}-${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.cache-version }}-${{ runner.os }}-npm-

      - run: npm ci
      - run: npm run format
      - run: npm run stylelint
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ needs.setup.outputs.npm-cache-dir-path }}
          key: ${{ env.cache-version }}-${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.cache-version }}-${{ runner.os }}-npm-

      - run: npm ci
      - run: npm run test

  # Remix 3 にビルドステップは無いため、旧 build ジョブに代えて
  # ルート契約の読み込み(routes)と Worker のバンドル(bundle)を確認する。
  # bundle は本番と同じ scripts/deploy.sh を `--dry-run` 付きで両環境に対して
  # 実行し、デプロイせずにバンドルの成否とサイズを確かめる。Node 専用 API が
  # 混入した場合も、deploy.sh 自体が壊れた場合も、develop / main に入る前に
  # ここで落ちる。
  build:
    runs-on: ubuntu-latest
    needs: [setup, lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ needs.setup.outputs.npm-cache-dir-path }}
          key: ${{ env.cache-version }}-${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.cache-version }}-${{ runner.os }}-npm-

      - run: npm ci
      - name: Check route contract
        run: npm run routes
      - name: Bundle the Worker through scripts/deploy.sh
        run: |
          sh scripts/deploy.sh development --dry-run --outdir=tmp/worker-development
          sh scripts/deploy.sh production --dry-run --outdir=tmp/worker-production
